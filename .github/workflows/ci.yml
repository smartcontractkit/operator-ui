name: CI

on:
  push:
    branches:
      - main
  pull_request:


jobs:
  eslint:
    name: ESLint (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: yarn

      - name: Run yarn install
        run: yarn install --frozen-lockfile

      - name: Setup project
        run: yarn setup
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run eslint
        run: yarn run lint -f json -o eslint-report.json

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eslint-report
          path: ./eslint-report.json

  unit-tests-matrix:
    strategy:
      matrix:
        shardIndex: [1]
        shardTotal: [1]

    name: Unit Tests ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # required by CodCov

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: yarn

      - name: Run yarn install
        run: yarn install --frozen-lockfile

      - name: Setup project
        run: yarn setup
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run tests
        run: yarn run test:ci --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload CodCov coverage report
        run: ./bin/codecov -s ./coverage

      - name: Rename unit-test coverage report as belonging to the shard ${{ matrix.shardIndex }}
        run: mv coverage/lcov.info coverage/${{matrix.shardIndex}}_lcov.info

      - name: Upload unit-test coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-coverage-${{ matrix.shardIndex }}
          path: ./coverage/${{matrix.shardIndex}}_lcov.info

  unit-tests:
    # name required due to malformed required checks
    name: Unit Tests 1/1
    runs-on: ubuntu-latest
    permissions: {}
    needs: unit-tests-matrix
    steps:
      - name: Check unit test matrix results
        env:
          RESULT: ${{ needs.unit-tests-matrix.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "One or more shards in the unit test matrix failed. Failing the unit-tests job."
            exit 1
          else
            echo "All shards in the unit test matrix succeeded."
          fi
